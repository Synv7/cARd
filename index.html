<body>
<title>Josephs Morris cARd</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen. Full-bleed graphite stage; name top-left, status top-right; a floating
   glass control bar at the bottom that sheets rise from. Single dark look by choice: the
   filament glow and the camera feed read best on ink, and the wood card stays the only warm surface. */
:root {
  color-scheme: dark;
  --ink: #0b0b0c;          /* stage and page */
  --panel: #151517;        /* sheets */
  --raise: #1e1e21;        /* controls on panels */
  --text: #f2f1ee;
  --muted: #8f8e8a;
  --line: rgba(255, 255, 255, .09);
  --line-strong: rgba(255, 255, 255, .17);
  --glow: #ffd8a8;         /* filament warm white: the one accent */
  --sans: "Geist", "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --ease: cubic-bezier(.2, .8, .2, 1);
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font-family: var(--sans); font-size: 15px; line-height: 1.45; letter-spacing: -.005em;
  overflow: hidden; overscroll-behavior: none; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
#app { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }

/* ---------- stage ---------- */
#stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(110% 70% at 50% 46%, #19191b 0%, #111113 50%, var(--ink) 100%); }
#cam, #camframe { position: absolute; top: 0; left: 0; object-fit: cover; display: none; }
#app[data-mode="card"] #cam, #app[data-mode="card"] #camframe.on { display: block; }
#app[data-mode="card"] #stage { background: #000; }
#app[data-mode="room"] #stage { background: transparent; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#loader {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  pointer-events: none; transition: opacity .5s var(--ease);
}
#loader .filament { width: 72px; height: 1px; background: var(--line-strong); position: relative; overflow: hidden; }
#loader .filament span { position: absolute; inset: 0; width: 0%; background: var(--glow); box-shadow: 0 0 8px var(--glow); transition: width .3s var(--ease); }
#loader.done { opacity: 0; }
#stage-fallback { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: min(320px, 80vw); text-align: center; color: var(--muted); font-size: 14px; }

/* ---------- overlay ---------- */
#ui { position: absolute; inset: 0; pointer-events: none; }
.sheet, .toast { pointer-events: auto; }
.top {
  position: absolute; top: 0; left: 0; right: 0; pointer-events: none;
  padding-block: calc(env(safe-area-inset-top, 0px) + 18px) 0;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
}
.top > * { pointer-events: auto; }
.ident { min-width: 0; }
.eyebrow { margin: 0 0 8px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.name { margin: 0; font-weight: 600; font-size: clamp(28px, 7.6vw, 44px); line-height: 1; letter-spacing: -.035em; color: var(--text); text-wrap: balance; }
.role { margin: 8px 0 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
.role b { font-weight: 500; color: var(--text); }
.status {
  flex: none; display: inline-flex; align-items: center; gap: 7px; margin-top: 1px;
  padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line);
  background: rgba(11, 11, 12, .5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap;
}
.status .dot { width: 6px; height: 6px; border-radius: 50%; background: #55544f; }
.status[data-state="live"] { color: var(--text); }
.status[data-state="live"] .dot { background: var(--glow); box-shadow: 0 0 8px var(--glow); }
.status[data-state="busy"] .dot { background: var(--glow); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .2; } }

/* ---------- control bar ---------- */
.bottom {
  position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
  padding-block: 0 calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.bottom > * { pointer-events: auto; }
.hint { margin: 0; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: center; pointer-events: none; }
.plate {
  width: 100%; max-width: 520px; box-sizing: border-box;
  display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 6px; padding: 6px;
  border-radius: 18px; border: 1px solid var(--line);
  background: rgba(21, 21, 23, .72); backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
  box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
}
.plate.two { grid-template-columns: 1fr 1fr; }
.plate.one { grid-template-columns: 1fr; }
.pbtn {
  appearance: none; border: 0; cursor: pointer; min-height: 48px; padding: 0 12px; border-radius: 13px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--sans); font-weight: 500; font-size: 14.5px; letter-spacing: -.01em; color: var(--text); background: transparent;
  transition: background .2s, transform .15s var(--ease); -webkit-user-select: none; user-select: none;
}
.pbtn svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.pbtn:hover { background: rgba(255, 255, 255, .06); }
.pbtn:active { transform: scale(.98); }
.pbtn.primary { background: var(--text); color: var(--ink); }
.pbtn.primary:hover { background: #ffffff; }
.pbtn.primary svg { opacity: 1; }
:focus-visible { outline: 1.5px solid var(--glow); outline-offset: 2px; }

/* ---------- scan overlay ---------- */
.scan { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.scan-inner { display: flex; flex-direction: column; align-items: center; gap: 20px; width: min(80vw, 440px); margin-top: -6vh; }
.frame { position: relative; width: 100%; aspect-ratio: 1.73; max-width: 100%; transition: opacity .4s var(--ease), transform .4s var(--ease); }
.frame i { position: absolute; width: 22px; height: 22px; border: 1.5px solid var(--text); }
.frame .tl { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 12px; }
.frame .tr { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 12px; }
.frame .bl { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 12px; }
.frame .br { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 12px; }
.beam { position: absolute; left: 8%; right: 8%; height: 1px; top: 12%; background: linear-gradient(90deg, transparent, var(--glow), transparent); box-shadow: 0 0 12px 1px rgba(255, 216, 168, .5); animation: sweep 2.4s ease-in-out infinite alternate; }
@keyframes sweep { to { top: 88%; } }
.scan-msg { margin: 0; text-align: center; font-size: 15px; font-weight: 500; color: var(--text); text-shadow: 0 1px 12px rgba(0, 0, 0, .8); text-wrap: balance; }
.meter { width: 64%; display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 10px; color: var(--muted); }
.meter .bar { flex: 1; height: 2px; border-radius: 2px; background: var(--line-strong); overflow: hidden; }
.meter .bar span { display: block; height: 100%; width: 0%; background: var(--glow); transition: width .25s linear; }
.scan[data-locked] .frame { opacity: 0; transform: scale(1.05); }
.scan[data-locked] .scan-msg { opacity: 0; }

/* ---------- sheet ---------- */
.sheet { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: fade .25s var(--ease); }
.sheet-panel {
  position: relative; width: 100%; max-width: 520px; max-height: min(78vh, 680px); overflow: auto; box-sizing: border-box;
  margin-left: var(--gutter-l); margin-right: var(--gutter-r); margin-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding: 6px 20px 20px; border-radius: 22px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text); box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
  animation: rise .32s var(--ease);
}
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.grab { width: 36px; height: 4px; border-radius: 4px; background: var(--line-strong); margin: 6px auto 14px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; font-weight: 600; font-size: 22px; line-height: 1.15; letter-spacing: -.03em; text-wrap: balance; }
.sheet-head p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.x { appearance: none; border: 0; background: transparent; color: var(--muted); width: 36px; height: 36px; margin: -4px -8px 0 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center; flex: none; }
.x:hover { background: rgba(255, 255, 255, .07); color: var(--text); }
.x svg { width: 18px; height: 18px; }
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row.hl { background: linear-gradient(90deg, rgba(255, 216, 168, .08), transparent 70%); border-radius: 12px; }
.ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--text); border: 1px solid var(--line-strong); box-sizing: border-box; }
.ico svg { width: 17px; height: 17px; }
.row-main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row-label { font-weight: 500; font-size: 15px; }
.row-value { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 520px) {
  .rows .row:has(.row-actions > :nth-child(2)) { grid-template-columns: 36px minmax(0, 1fr); row-gap: 10px; }
  .rows .row:has(.row-actions > :nth-child(2)) .row-actions { grid-column: 2; justify-content: flex-start; }
}
.mini {
  appearance: none; border: 0; cursor: pointer; text-decoration: none; white-space: nowrap;
  min-height: 34px; padding: 0 13px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--sans); font-weight: 500; font-size: 13px; color: var(--ink); background: var(--text);
}
.mini svg { width: 14px; height: 14px; }
.mini.ghost { color: var(--text); background: transparent; box-shadow: 0 0 0 1px var(--line-strong) inset; }
.mini:hover { filter: brightness(1.08); }
.mini.ghost:hover { background: rgba(255, 255, 255, .06); }
.sheet-foot { margin: 14px 0 0; font-size: 12px; color: var(--muted); }
.sheet-foot button { font: inherit; color: var(--text); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-strong); background: none; border: 0; padding: 0; cursor: pointer; }
.notice-body { padding: 14px 0 2px; font-size: 14.5px; color: var(--muted); max-width: 46ch; }
.notice-body p { margin: 0 0 10px; }
.single .row { grid-template-columns: 44px minmax(0, 1fr); padding: 16px 0 4px; border: 0; }
.single .ico { width: 44px; height: 44px; }
.single .ico svg { width: 20px; height: 20px; }
.single .row-label { font-size: 16px; }
.single .row-value { font-size: 13px; color: var(--text); }
.single .row-actions { grid-column: 1 / -1; justify-content: stretch; padding-top: 10px; }
.single .row-actions .mini { flex: 1; justify-content: center; min-height: 46px; font-size: 14.5px; }

/* ---------- toast ---------- */
.toast {
  position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 96px); transform: translateX(-50%); z-index: 30;
  padding: 8px 14px; border-radius: 999px; background: var(--text); color: var(--ink);
  font-weight: 500; font-size: 13px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); animation: rise .25s var(--ease); white-space: nowrap;
}
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* modes */
#app[data-mode="card"] .role, #app[data-mode="room"] .role { display: none; }
#app[data-mode="card"] .name, #app[data-mode="room"] .name { font-size: clamp(22px, 6vw, 30px); }
#app[data-mode="card"] .ident, #app[data-mode="room"] .ident { text-shadow: 0 1px 10px rgba(0, 0, 0, .6); }

@media (min-width: 760px) { .top { padding-block: calc(env(safe-area-inset-top, 0px) + 28px) 0; } }
@media (prefers-reduced-motion: reduce) {
  .beam { animation: none; top: 50%; }
  .status[data-state="busy"] .dot { animation: none; }
  .sheet-panel, .sheet-backdrop, .toast { animation: none; }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",

<div id="app" data-mode="preview">
  <div id="stage">
    <video id="cam" muted playsinline autoplay></video>
    <canvas id="camframe" aria-hidden="true"></canvas>
    <canvas id="gl" aria-label="3D business card. The keys below the card open contact links; the All links button lists them too."></canvas>
    <div id="loader" role="status" aria-live="polite"><div class="filament"><span id="loader-bar"></span></div><span id="loader-text">Wiring the bulb</span></div>
  </div>

  <div id="ui">
    <div class="top">
      <header class="ident">
        <p class="eyebrow">Bakersfield College</p>
        <h1 class="name">Josephs Morris</h1>
        <p class="role"><b>Laboratory Technician I</b><br>Innovation Lab · Industrial Technology</p>
      </header>
      <div class="status" id="status" data-state="idle" aria-live="polite"><span class="dot"></span><span id="status-text">3D preview</span></div>
    </div>

    <div class="scan" id="scan" hidden>
      <div class="scan-inner">
        <div class="frame" aria-hidden="true"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><div class="beam"></div></div>
        <p class="scan-msg" id="scan-msg">Starting the camera</p>
        <div class="meter" id="meter" hidden><div class="bar"><span id="meter-bar"></span></div><span id="meter-pct">0%</span></div>
      </div>
    </div>

    <div class="bottom">
      <p class="hint" id="hint">Tap a key under the card · drag to look around</p>
      <nav class="plate" id="plate" aria-label="Experience controls">
        <button class="pbtn primary" id="btn-scan" type="button"></button>
        <button class="pbtn" id="btn-room" type="button" hidden></button>
        <button class="pbtn" id="btn-links" type="button"></button>
        <button class="pbtn" id="btn-exit" type="button" hidden></button>
      </nav>
    </div>

    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <div class="sheet-backdrop" data-close></div>
      <div class="sheet-panel" id="sheet-panel">
        <div class="grab"></div>
        <div class="sheet-head">
          <div><h2 id="sheet-title">Contact</h2><p id="sheet-sub"></p></div>
          <button class="x" type="button" data-close aria-label="Close"></button>
        </div>
        <div id="sheet-body"></div>
      </div>
    </div>
  </div>

  <nav class="sr-only" id="sr-links" aria-label="Contact links"></nav>
</div>

<script type="module">
/* =====================================================================
   cARd — Josephs Morris · Bakersfield College Innovation Lab
   Modes:  preview (3D, any browser) · card (camera image tracking, MindAR)
           · room (WebXR immersive-ar with hit-test + DOM overlay)
   Edit CONFIG to change links, the model, or the tracking target.
   Brand icons: Font Awesome Free 6.7.2 (CC BY 4.0), loaded at runtime.
   ===================================================================== */
const CONFIG = {
  person: {
    first: 'Josephs', last: 'Morris', title: 'Laboratory Technician I',
    org: 'Bakersfield College', unit: 'Innovation Lab, Industrial Technology',
    phone: '+16613953542', phoneDisplay: '(661) 395-3542',
    email: 'Josephs.Morris@BakersfieldCollege.edu',
    web: 'https://www.bakersfieldcollege.edu/',
  },
  // The eight keys under the card, in order (two rows of four).
  keys: [
    { id: 'call', label: 'Call', face: 'Call', icon: 'phone', kind: 'tel' },
    { id: 'email', label: 'Email', face: 'Email', icon: 'mail', kind: 'mail' },
    { id: 'web', label: 'Website', face: 'Website', icon: 'globe', kind: 'url', value: 'bakersfieldcollege.edu', href: 'https://www.bakersfieldcollege.edu/' },
    { id: 'save', label: 'Save contact', face: 'Save', icon: 'contact', kind: 'vcard', value: 'Name, title, phone, email, website' },
    { id: 'linkedin', label: 'LinkedIn', face: 'LinkedIn', fa: 'faLinkedin', kind: 'url', value: 'Bakersfield College on LinkedIn', href: 'https://www.linkedin.com/school/bakersfieldcollege/' },
    { id: 'instagram', label: 'Instagram', face: 'Instagram', fa: 'faInstagram', kind: 'url', value: '@bakersfieldcollege', href: 'https://www.instagram.com/bakersfieldcollege/' },
    { id: 'facebook', label: 'Facebook', face: 'Facebook', fa: 'faFacebook', kind: 'url', value: 'Bakersfield College on Facebook', href: 'https://www.facebook.com/BakersfieldCollege' },
    { id: 'youtube', label: 'YouTube', face: 'YouTube', fa: 'faYoutube', kind: 'url', value: 'Bakersfield College on YouTube', href: 'https://www.youtube.com/user/BakersfieldCollege' },
  ],
  modelUrl: './model.glb',            // any glTF/GLB; it is auto-scaled to stand on the logo
  cardTexture: './card.jpg',
  target: { image: './card-target.jpg', mind: null, version: 2 }, // set mind: './card.mind' to skip in-browser compiling; bump version when the card image changes
  // Card-tracking stability. If the overlay still shakes on a phone, lower the cutoffs (steadier, a little more lag).
  tracking: {
    cameraFov: 64,       // degrees across the long side of the phone camera image (most phone main cameras: 60–70)
    smoothing: { posCutoff: 0.5, posBeta: 32, rotCutoff: 0.5, rotBeta: 8 }, // One Euro filter on position and rotation (Hz)
    holdMs: 600,         // keep the overlay on its last pose this long when the card is briefly lost
    syncFeed: true,      // show the exact camera frame each pose was computed from, so the overlay never trails the video
  },
  motion: { spin: 0.35, rings: 0.4 }, // bulb turn speed (rad/s) and halo animation speed (1 = as authored)
  hostedUrl: null,                     // public https address of the hosted page, shown when the camera is blocked
  libs: {
    mindar: 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js',
    brands: 'https://cdn.jsdelivr.net/npm/@fortawesome/free-brands-svg-icons@6.7.2/+esm',
  },
};

// Card geometry in "card units": width 1, origin at the card centre, +z out of the face.
const CARD = { w: 1, h: 1472 / 2548, r: 0.034, t: 0.03, logo: { x: 0.249, y: 0.021 } };
const KEY = { w: 0.225, h: 0.13, d: 0.03, pitchX: 0.25, pitchY: 0.155, top: -CARD.h / 2 - 0.1 };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const IN_ARTIFACT = !!(window.claude && typeof window.claude.use === 'function') || /claude|anthropic/i.test(location.hostname);

/* ------------------------------------------------------------- icons */
const ICONS = {
  phone: { vb: [24, 24], mode: 'stroke', d: 'M5.2 3.6h3.1l1.6 4.1-2 1.3a11.4 11.4 0 0 0 5.1 5.1l1.3-2 4.1 1.6v3.1a1.9 1.9 0 0 1-2 1.9C10.1 18.3 5.7 13.9 3.3 5.6a1.9 1.9 0 0 1 1.9-2z' },

el.sheet.addEventListener('click', e => {
  const t = e.target.closest('[data-close],[data-copy],[data-all],[data-vcf]');
  if (!t) return;
  if (t.hasAttribute('data-close')) return closeSheet();
  if (t.dataset.all) return openAll(t.dataset.all);
  if (t.hasAttribute('data-vcf')) { e.preventDefault(); return downloadVcf(); }
  const id = t.dataset.copy;

  const k = CONFIG.keys.find(x => x.id === id);
  copyText(k.value, $('val-' + id));
});

  cardTex.colorSpace = THREE.SRGBColorSpace; cardTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const keysGroup = new THREE.Group(); rig.add(keysGroup);
  const keys = []; const keyHitMeshes = [];
  const keyBodyGeo = new RoundedBoxGeometry(KEY.w, KEY.h, KEY.d, 4, 0.012);
  const keyFaceGeo = new THREE.PlaneGeometry(KEY.w - 0.02, KEY.h - 0.02);

  function thinGlass() {

function idb(op, key, val) {

    try {
      const req = indexedDB.open('card-ar', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onerror = () => res(null);
      req.onsuccess = () => {
        try {
          const tx = req.result.transaction('kv', op === 'get' ? 'readonly' : 'readwrite'), st = tx.objectStore('kv');

          r.onsuccess = () => res(op === 'get' ? r.result ?? null : true); r.onerror = () => res(null);
